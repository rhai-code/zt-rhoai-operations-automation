---
# Strategic-merge (server-side) patch enabling the MLflow operator. Lab
# clusters ship the DSC component Removed — without it the operator never
# installs the MLflow CRDs and the instance CR below cannot be applied.
#
# Applied with the Application's ServerSideApply=true syncOption (kubectl
# apply --server-side --force-conflicts), so this partial manifest owns ONLY
# the mlflowoperator component key — the rest of the DataScienceCluster stays
# owned by whoever set it (the cluster provisioning).
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    mlflowoperator:
      managementState: Managed
