---
# RHOAI operator subscription. The channel is the version pin (stable-3.5):
# within a channel the operator upgrades automatically, Module 4 audits the
# pinning posture. For disconnected installs, change `source` to the local
# CatalogSource (see the workshop's disconnected appendix).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-3.5
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
