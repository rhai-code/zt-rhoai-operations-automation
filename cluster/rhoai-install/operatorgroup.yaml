---
# All-namespaces OperatorGroup (empty spec = AllNamespaces) for the RHOAI
# operator. A namespace may hold only ONE OperatorGroup — the lab clusters
# pre-provision no other group in redhat-ods-operator.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
