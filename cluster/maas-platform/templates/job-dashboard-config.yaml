---
# Reveals the MaaS + observability + Gen AI studio views in the RHOAI dashboard
# by merge-patching the OdhDashboardConfig.
#
# WHY A JOB AND NOT A MANIFEST: the OdhDashboardConfig CR is created by the
# dashboard operator (from the DSC dashboard component) — Git-owning the whole
# CR would fight the operator over fields it manages. A merge patch touches
# ONLY the four dashboardConfig flags (the mlflow dsc-patch pattern).
#
# Wave 4 (the CR exists once the dashboard is up — the Job waits for it).
# Idempotent (merge patch of the same values); BeforeHookCreation re-runs on
# every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-dashboard-config
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: maas-setup
      restartPolicy: OnFailure
      containers:
        - name: dashboard-config
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # The dashboard operator creates the CR from the DSC dashboard
              # component; wait for it.
              until oc -n redhat-ods-applications get odhdashboardconfig odh-dashboard-config >/dev/null 2>&1; do
                echo "waiting for the OdhDashboardConfig CR"; sleep 10
              done
              # Merge patch — touches ONLY the four flags:
              #   modelAsService        — the MaaS view (AI asset endpoints, API keys)
              #   observabilityDashboard — the "Observe & monitor -> Dashboard" nav
              #   genAiStudio           — the "Gen AI studio -> Playground" nav
              #   enablement            — the documented Gen AI studio combo
              oc -n redhat-ods-applications patch odhdashboardconfig odh-dashboard-config --type=merge \
                -p '{"spec":{"dashboardConfig":{"modelAsService":true,"observabilityDashboard":true,"genAiStudio":true,"enablement":true}}}'
              echo "dashboard MaaS/observability/GenAI views enabled"
