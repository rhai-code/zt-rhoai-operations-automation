---
# Creates the MaaS database secrets IF ABSENT — never overwrites, so the
# PostgreSQL password stays stable across syncs (the database keeps its
# bootstrapped password; overwriting would desync the secret from the
# initialized database).
#
# WHY A JOB AND NOT A MANIFEST: the password is generated at apply time
# (from /dev/urandom — the current ose-cli image no longer ships openssl) and
# must never live in git.
#
# Wave 0, before the postgres Deployment (Job sorts before Deployment within
# the wave) — the pod retries until the secrets exist. On a fresh cluster
# redhat-ods-applications is created by the DSCI (rhoai-install, parallel) —
# the Job retries until it exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-postgres-secrets
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 40
  template:
    spec:
      serviceAccountName: maas-setup
      restartPolicy: OnFailure
      containers:
        - name: secrets
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS=redhat-ods-applications
              if oc -n "$NS" get secret postgres-creds >/dev/null 2>&1; then
                echo "postgres-creds exists — reusing its password"
                PGPASS=$(oc -n "$NS" get secret postgres-creds \
                  -o jsonpath='{.data.POSTGRESQL_PASSWORD}' | base64 -d)
              else
                echo "creating postgres-creds with a generated password"
                # /dev/urandom + base64 — the floating ose-cli:latest dropped
                # the openssl binary (an older pull had it, which is why this
                # passed on fde2 and broke on the fresh cluster).
                PGPASS=$(head -c 16 /dev/urandom | base64 | tr -d '=+/')
                # The Red Hat rhel9/postgresql-15 image reads POSTGRESQL_* env
                # vars (not POSTGRES_*) to create the user, password, and
                # database on first start.
                oc -n "$NS" create secret generic postgres-creds \
                  --from-literal=POSTGRESQL_USER=maas \
                  --from-literal=POSTGRESQL_PASSWORD="${PGPASS}" \
                  --from-literal=POSTGRESQL_DATABASE=maas
              fi
              if oc -n "$NS" get secret maas-db-config >/dev/null 2>&1; then
                echo "maas-db-config exists — nothing to do"
              else
                oc -n "$NS" create secret generic maas-db-config \
                  --from-literal=DB_CONNECTION_URL="postgresql://maas:${PGPASS}@postgres:5432/maas?sslmode=disable"
              fi
              echo "MaaS database secrets ready"
