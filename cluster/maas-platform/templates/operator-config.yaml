---
# Activation CRs for the serving-path operators. Each operator watches for a
# singleton CR named `cluster` and, once created, rolls out its controller (the
# LeaderWorkerSet and JobSet controllers that KServe's LLMInferenceService pods
# depend on). Git-managed directly: the CRDs are registered by the LWS/JobSet
# operator CSVs, so on a fresh cluster the first sync attempts fail with
# "no matches for kind" until the CSVs install — SkipDryRunOnMissingResource +
# the app's retry bridge the gap (the same pattern as the kueue app).
apiVersion: operator.openshift.io/v1
kind: LeaderWorkerSetOperator
metadata:
  name: cluster
spec:
  managementState: Managed
  logLevel: Normal
  operatorLogLevel: Normal
---
apiVersion: operator.openshift.io/v1
kind: JobSetOperator
metadata:
  name: cluster
spec:
  logLevel: Normal
  operatorLogLevel: Normal
