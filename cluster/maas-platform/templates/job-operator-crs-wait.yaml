---
# Gate: waits for the operator CSVs to reach Succeeded and the CRDs they
# register to be Established, BEFORE wave 2 applies the Kuadrant CR, the
# serving-operator activation CRs, and the telemetry CRs. Applying those in the
# same pass as the subscriptions races CRD registration and fails with
# "no matches for kind" (see the connectivity-link comment).
#
# CSV names carry the version, so each is located by prefix. The istio
# telemetries CRD ships with RHOAI serving (the rhoai-install app, parallel) —
# the wait covers the whole window. Idempotent; BeforeHookCreation re-runs on
# every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-operator-crs-wait
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: maas-setup
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Wait for an operator CSV (by name prefix — the name carries the
              # version) to reach Succeeded.
              wait_csv() {
                local ns=$1 prefix=$2
                until oc -n "$ns" get csv -o name | grep -q "^csv/${prefix}"; do
                  echo "waiting for the ${prefix} CSV in ${ns}"; sleep 15
                done
                local csv
                csv=$(oc -n "$ns" get csv -o name | grep "^csv/${prefix}" | head -1)
                echo "waiting for ${csv} to reach Succeeded"
                oc -n "$ns" wait --for=condition=Succeeded "$csv" --timeout=1200s
              }
              wait_csv openshift-operators rhcl-operator
              wait_csv openshift-lws-operator leader-worker-set
              wait_csv openshift-jobset-operator job-set
              # The CRDs wave 2 applies — Kuadrant (RHCL CSV), the serving
              # operators (their CSVs), Istio telemetry (RHOAI serving).
              oc wait --for=condition=Established crd/kuadrants.kuadrant.io --timeout=1200s
              oc wait --for=condition=Established crd/leaderworkersetoperators.operator.openshift.io --timeout=1200s
              oc wait --for=condition=Established crd/jobsetoperators.operator.openshift.io --timeout=1200s
              oc wait --for=condition=Established crd/telemetries.telemetry.istio.io --timeout=1200s
              oc wait --for=condition=Established crd/telemetrypolicies.extensions.kuadrant.io --timeout=1200s
              echo "operator CSVs Succeeded; CRDs established"
