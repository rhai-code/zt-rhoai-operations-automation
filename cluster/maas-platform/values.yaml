# cluster/maas-platform/values.yaml
#
# The Models-as-a-Service platform stack: RHCL (Kuadrant) + cert-manager
# operators, the maas-default-gateway, the MaaS PostgreSQL, the observability
# and serving-path operators, user workload monitoring, and the MaaS telemetry.
# Prerequisite for cluster/maas-model (the Lending model attaches to
# maas-default-gateway).
#
# Values are supplied by the bootstrap child Application
# (cluster/infra/bootstrap/templates/application-maas-platform.yaml):
#   deployer.domain — the cluster apps domain (Route host + gateway status
#                     patch), set at the one-time bootstrap apply — never in git.
#   gatewayMode     — clusterip (default, RHDP/bare-metal) | loadbalancer
#                     (cloud/MetalLB clusters).
#
# Secrets: postgres-creds + maas-db-config are generated by the
# postgres-secrets hook Job (create-if-absent, random password) — never in git.

deployer:
  domain: apps.cluster-guid.example.com # set at the one-time bootstrap apply

# clusterip: for clusters WITHOUT a LoadBalancer provider (RHDP, bare-metal).
# The gateway Service is typed LoadBalancer (it still gets a ClusterIP the
# Route reaches) and the gateway-status Job patches the Service status with
# the Route hostname, which the gateway controller reflects into
# gateway.status.addresses for the maas-api to discover.
# loadbalancer: for clusters with a cloud/MetalLB provider — the Gateway
# listener hostname carries the domain and no Route is needed.
gatewayMode: clusterip

postgres:
  storageSize: 5Gi
