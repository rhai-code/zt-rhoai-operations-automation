# FreeIPA CA + Keycloak truststore — extracts /etc/ipa/ca.crt from the FreeIPA
# pod, creates the freeipa-ca Secret in the Keycloak namespace, and patches the
# EXISTING Keycloak CR spec.truststores (rhbk operator re-rolls the server with
# the truststore). Idempotent (merge patch + dry-run client secret).
{{- if .Values.password }}
apiVersion: batch/v1
kind: Job
metadata:
  name: freeipa-ca-truststore
  namespace: {{ .Values.freeipaNamespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: freeipa-setup
      restartPolicy: OnFailure
      containers:
        - name: truststore
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              for i in $(seq 1 120); do
                FREEIPA_POD=$(kubectl get pods -n {{ .Values.freeipaNamespace }} -l app=freeipa -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                READY=$(kubectl get pod -n {{ .Values.freeipaNamespace }} "$FREEIPA_POD" -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
                if [ -n "$FREEIPA_POD" ] && [ "$READY" = "true" ]; then break; fi
                echo "Waiting for FreeIPA ($i/120)..."; sleep 15
              done
              if [ -z "$FREEIPA_POD" ] || [ "$READY" != "true" ]; then
                echo "FreeIPA never became ready"; exit 1
              fi
              kubectl exec -n {{ .Values.freeipaNamespace }} "$FREEIPA_POD" -- cat /etc/ipa/ca.crt > /tmp/ca.crt
              kubectl create secret generic freeipa-ca \
                --from-file=ca.crt=/tmp/ca.crt \
                -n {{ .Values.keycloakNamespace }} --dry-run=client -o yaml | kubectl apply -f -
              echo "Patching Keycloak CR {{ .Values.keycloakName }} with the truststore"
              kubectl patch keycloak {{ .Values.keycloakName }} -n {{ .Values.keycloakNamespace }} --type=merge -p '{
                "spec": {
                  "truststores": {
                    "freeipa-ca": { "secret": { "name": "freeipa-ca" } }
                  }
                }
              }'
              for i in $(seq 1 120); do
                READY=$(kubectl get pod {{ .Values.keycloakName }}-0 -n {{ .Values.keycloakNamespace }} -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
                TS=$(kubectl exec -n {{ .Values.keycloakNamespace }} {{ .Values.keycloakName }}-0 -- test -f /opt/keycloak/conf/truststores/secret-freeipa-ca/ca.crt >/dev/null 2>&1 && echo yes || echo no)
                if [ "$READY" = "true" ] && [ "$TS" = "yes" ]; then
                  echo "Keycloak re-rolled with the truststore"; break
                fi
                echo "Waiting for Keycloak re-roll with truststore ($i/120)..."; sleep 15
              done
              if [ "$READY" != "true" ] || [ "$TS" != "yes" ]; then
                echo "Keycloak never re-rolled with the truststore"; exit 1
              fi
{{- end }}
