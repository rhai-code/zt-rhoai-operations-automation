apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  name: infra
  namespace: openshift-gitops
spec:
  description: Infra layer of the RHOAI Operations workshop (LDAP directory + identity setup + MaaS model + MLflow)
  sourceRepos:
    - https://github.com/rhai-code/zt-rhoai-operations-automation
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: config.openshift.io
      kind: OAuth
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: machineconfiguration.openshift.io
      kind: MachineConfig
    # user.openshift.io/Group is cluster-scoped — the restored rhods-admins
    # Group needs it whitelisted (the namespace '*' whitelist doesn't apply)
    - group: user.openshift.io
      kind: Group
    # MLflow: the cluster-scoped MLflow instance CR and the DataScienceCluster
    # patch that enables the mlflowoperator component (both cluster-scoped —
    # the namespace '*' whitelist doesn't apply)
    - group: mlflow.opendatahub.io
      kind: MLflow
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
