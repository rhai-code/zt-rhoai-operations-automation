apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  name: infra
  namespace: openshift-gitops
spec:
  description: Infra layer of the RHOAI Operations workshop (LDAP directory + identity setup + MaaS model + MLflow + Kueue + OADP)
  sourceRepos:
    - https://github.com/rhai-code/zt-rhoai-operations-automation
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: config.openshift.io
      kind: OAuth
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: machineconfiguration.openshift.io
      kind: MachineConfig
    # user.openshift.io/Group is cluster-scoped — the restored rhods-admins
    # Group needs it whitelisted (the namespace '*' whitelist doesn't apply)
    - group: user.openshift.io
      kind: Group
    # MLflow: the cluster-scoped MLflow instance CR (both cluster-scoped —
    # the namespace '*' whitelist doesn't apply)
    - group: mlflow.opendatahub.io
      kind: MLflow
    # Kueue: the cluster-scoped Kueue operator configuration CR — the RHBoK
    # operator waits for it before installing the kueue.x-k8s.io CRDs — and the
    # cluster-scoped demo queues (ClusterQueue/Cohort/ResourceFlavor; LocalQueue
    # is namespaced). The DSC itself is NOT in this list: the mlflow hook Job
    # enables the mlflowoperator component via a merge patch through RBAC, not
    # via an ArgoCD-managed DataScienceCluster resource.
    - group: kueue.openshift.io
      kind: Kueue
    - group: kueue.x-k8s.io
      kind: ClusterQueue
    - group: kueue.x-k8s.io
      kind: Cohort
    - group: kueue.x-k8s.io
      kind: ResourceFlavor
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
