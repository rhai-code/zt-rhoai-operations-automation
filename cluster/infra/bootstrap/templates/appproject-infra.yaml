apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  name: infra
  namespace: openshift-gitops
spec:
  description: Infra layer of the RHOAI Operations workshop (LDAP directory + identity federation)
  sourceRepos:
    - https://github.com/rhai-code/zt-rhoai-operations-automation
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: oauthes.config.openshift.io
      kind: OAuth
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
