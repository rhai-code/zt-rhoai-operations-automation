# cluster/infra/freeipa/values.yaml
#
# FreeIPA server deployment as plain manifests (no external chart dependency —
# the old freeipa.github.io/helm-charts repo is dead). The server runs its
# unattended ipa-server-install on first start; /data persists the install.
#
# namespace, realm, domain, hostname, password, storageClass, storageSize,
# ingressDomain — all supplied by the bootstrap child Application.

namespace: freeipa

# Fedoracapital demo identity. The server's own hostname MUST match what the
# OCP-native LDAP IdP connects to (ldaps://freeipa.<ns>.svc.cluster.local:636) —
# the headless service resolves to the pod, so the cert matches.
realm: FEDORACAPITAL.IO
domain: fedoracapital.io
hostname: freeipa.freeipa.svc.cluster.local
password: REPLACE_AT_APPLY # set at the one-time bootstrap apply — never committed

# Storage for /data (the ipa-server-install persists here; survives restarts)
storageClass: "" # cluster default
storageSize: 5Gi

# Route exposing the FreeIPA web UI
ingressDomain: apps.cluster-guid.example.com

image:
  repository: quay.io/freeipa/freeipa-server
  tag: fedora-44

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

# SELinux boolean on the nodes (see templates/machineconfig.yaml). Applying it
# triggers a rolling reboot of the matching nodes — one-time disruption.
# role: worker covers every node with the worker role (this cluster's
# control-plane node also carries it).
machineconfig:
  enabled: true
  role: worker
  ignitionVersion: 3.4.0
