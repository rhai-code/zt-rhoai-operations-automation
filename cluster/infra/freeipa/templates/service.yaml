# ClusterIP service with every FreeIPA port. The in-cluster LDAP URL used by
# the Keycloak federation is ldaps://freeipa.<ns>.svc.cluster.local:636 — a fixed
# name that survives pod restarts; the FreeIPA CA (trusted via the Keycloak
# truststore) validates the chain.
apiVersion: v1
kind: Service
metadata:
  name: freeipa
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: freeipa
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: kerberos-udp
      port: 88
      protocol: UDP
      targetPort: 88
    - name: kerberos-tcp
      port: 88
      protocol: TCP
      targetPort: 88
    - name: kpasswd-udp
      port: 464
      protocol: UDP
      targetPort: 464
    - name: kpasswd-tcp
      port: 464
      protocol: TCP
      targetPort: 464
    - name: ldap
      port: 389
      targetPort: 389
    - name: ldaps
      port: 636
      targetPort: 636
