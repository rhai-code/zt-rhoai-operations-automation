# FreeIPA server as a StatefulSet. The unattended ipa-server-install runs on
# first start (15+ minutes); /data persists the install so restarts skip it.
# startupProbe gives the long install room without adversely impacting restarts;
# NO livenessProbe — any reasonable liveness probe kills the install process.
# Mounted volumes follow the freeipa-container maintainers' known-working recipe:
# /data (PVC), /sys/fs/cgroup (hostPath, systemd), /run + /tmp (memory-backed).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freeipa
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  serviceName: freeipa
  selector:
    matchLabels:
      app: freeipa
  template:
    metadata:
      labels:
        app: freeipa
    spec:
      serviceAccountName: freeipa
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: freeipa-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: IPA_SERVER_HOSTNAME
              value: {{ .Values.hostname }}
            - name: IPA_SERVER_INSTALL_OPTS
              value: >-
                --unattended
                --realm={{ .Values.realm }}
                --domain={{ .Values.domain }}
                --setup-dns
                --no-forwarders
                --no-ntp
                --ssh-trust-dns
                -p {{ .Values.password }}
                -a {{ .Values.password }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: ipa-data
              mountPath: /data
            - name: cgroups
              mountPath: /sys/fs/cgroup
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cgroups
          hostPath:
            path: /sys/fs/cgroup
        - name: run
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: ipa-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storageSize }}
